[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueferry-airpods"
version = "0.1.0"
description = "BlueFerry plugin: battery of your AirPods (left, right, case) from their Bluetooth adverts"
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.10"
# Only blueferry.plugin_api is used from BlueFerry. dbus-python and PyGObject
# come from the distribution (BlueFerry creates the plugin's venv with
# --system-site-packages).
dependencies = [
  "blueferry-plugin-api @ git+https://github.com/joshii-h/blueferry@plugin-api-v1.5.0#subdirectory=plugin-api",
  # Owner-only config file.
  "blueferry-plugin-kit @ git+https://github.com/joshii-h/blueferry-plugin-kit@kit-v0.4.0",
]

[project.optional-dependencies]
dev = [
  "blueferry-plugin-kit @ git+https://github.com/joshii-h/blueferry-plugin-kit@kit-v0.4.0",
  "pytest>=7,<10",
  "ruff>=0.5,<1",
]

[project.urls]
Homepage = "https://github.com/joshii-h/blueferry-plugin-airpods"
Source = "https://github.com/joshii-h/blueferry-plugin-airpods"

[project.scripts]
blueferry-airpods = "blueferry_airpods.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"blueferry_airpods" = ["*.plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B904", "RUF001", "RUF005"]

[tool.ruff.lint.isort]
known-first-party = ["blueferry_airpods"]
known-third-party = ["blueferry"]
